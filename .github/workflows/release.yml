name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip from .distignore
        run: |
          mkdir -p build/city-shipping-cod-rules
          rsync -a --exclude-from=.distignore --exclude=.distignore --exclude=build --exclude=.git ./ build/city-shipping-cod-rules/
          (cd build && zip -rq ../city-shipping-cod-rules-${GITHUB_REF_NAME#v}.zip city-shipping-cod-rules)
      - uses: softprops/action-gh-release@v2
        with:
          files: city-shipping-cod-rules-*.zip
          generate_release_notes: true